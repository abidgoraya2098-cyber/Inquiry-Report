<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0e2a47"/>
      <stop offset="60%" stop-color="#071829"/>
      <stop offset="100%" stop-color="#030c17"/>
    </radialGradient>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe885"/>
      <stop offset="25%" stop-color="#f5c037"/>
      <stop offset="50%" stop-color="#d99316"/>
      <stop offset="75%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Shield Interior Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="45%" stop-color="#061c33"/>
      <stop offset="100%" stop-color="#020d1a"/>
    </linearGradient>

    <!-- Emerald Glow for Police Justice -->
    <linearGradient id="emeraldRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix type="matrix" values="1 0 0 0 0.95  0 1 0 0 0.75  0 0 1 0 0.2  0 0 0 0.45 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with Security Pattern -->
  <rect width="512" height="512" rx="105" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Concentric Trim -->
  <rect x="14" y="14" width="484" height="484" rx="93" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.7"/>
  <rect x="24" y="24" width="464" height="464" rx="83" fill="none" stroke="#f5c037" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- Main Shield Body -->
  <g filter="url(#shadowFilter)">
    <!-- Outer Shield Border Gold -->
    <path d="M 256 62 
             C 338 62, 400 82, 412 118 
             C 418 218, 394 352, 256 426 
             C 118 352, 94 218, 100 118 
             C 112 82, 174 62, 256 62 Z" 
          fill="url(#goldGrad)"/>

    <!-- Inner Shield Border -->
    <path d="M 256 70 
             C 330 70, 390 88, 402 122 
             C 408 214, 384 340, 256 412 
             C 128 340, 104 214, 110 122 
             C 122 88, 182 70, 256 70 Z" 
          fill="#0a1d30"/>

    <!-- Shield Face Gradient -->
    <path d="M 256 78 
             C 324 78, 380 94, 392 126 
             C 398 210, 376 330, 256 398 
             C 136 330, 114 210, 120 126 
             C 132 94, 188 78, 256 78 Z" 
          fill="url(#shieldBg)"/>
  </g>

  <!-- Golden Laurel Wreath Leaves (Left & Right) -->
  <g fill="url(#goldGrad)" opacity="0.95" filter="url(#goldGlow)">
    <!-- Left Branch -->
    <path d="M 148 230 C 131 220, 126 200, 138 190 C 142 205, 151 218, 162 224 Z"/>
    <path d="M 138 265 C 120 258, 114 238, 124 226 C 130 242, 141 254, 154 258 Z"/>
    <path d="M 140 302 C 122 300, 114 280, 122 266 C 130 282, 142 292, 156 294 Z"/>
    <path d="M 154 338 C 136 340, 126 322, 132 306 C 142 320, 156 328, 170 328 Z"/>
    <path d="M 180 368 C 164 375, 150 360, 152 344 C 164 356, 180 360, 194 356 Z"/>
    <path d="M 216 392 C 200 402, 184 390, 184 374 C 196 384, 214 386, 226 380 Z"/>

    <!-- Right Branch -->
    <path d="M 364 230 C 381 220, 386 200, 374 190 C 370 205, 361 218, 350 224 Z"/>
    <path d="M 374 265 C 392 258, 398 238, 388 226 C 382 242, 371 254, 358 258 Z"/>
    <path d="M 372 302 C 390 300, 398 280, 390 266 C 382 282, 370 292, 356 294 Z"/>
    <path d="M 358 338 C 376 340, 386 322, 380 306 C 370 320, 356 328, 342 328 Z"/>
    <path d="M 332 368 C 348 375, 362 360, 360 344 C 348 356, 332 360, 318 356 Z"/>
    <path d="M 296 392 C 312 402, 328 390, 328 374 C 316 384, 298 386, 286 380 Z"/>
  </g>

  <!-- Crest: Golden Star and Crescent (ستارہ و ہلال) -->
  <g filter="url(#goldGlow)">
    <!-- Crescent Moon -->
    <path d="M 256 88 
             C 278 88, 296 106, 296 128 
             C 296 150, 278 168, 256 168 
             C 238 168, 222 155, 218 138 
             C 224 148, 236 155, 250 155 
             C 268 155, 282 141, 282 124 
             C 282 109, 271 97, 256 92 
             C 260 89, 265 88, 256 88 Z" 
          fill="url(#goldLight)"/>
    
    <!-- 5-Pointed Star -->
    <polygon points="256,104 260,115 271,115 262,122 266,133 256,126 246,133 250,122 241,115 252,115" 
             fill="url(#goldLight)"/>
  </g>

  <!-- Central Scales of Justice -->
  <g filter="url(#goldGlow)">
    <!-- Pillar -->
    <path d="M 256 185 L 256 312" stroke="url(#goldGrad)" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="256" cy="185" r="6" fill="url(#goldLight)"/>
    <circle cx="256" cy="312" r="9" fill="url(#goldLight)"/>
    <path d="M 236 318 L 276 318 L 282 326 L 230 326 Z" fill="url(#goldGrad)"/>

    <!-- Cross Balance Bar -->
    <path d="M 180 196 Q 256 184 332 196" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="180" cy="196" r="4" fill="url(#goldLight)"/>
    <circle cx="332" cy="196" r="4" fill="url(#goldLight)"/>

    <!-- Left Scale Plate & Chains -->
    <line x1="180" y1="196" x2="162" y2="234" stroke="url(#goldLight)" stroke-width="1.6" opacity="0.85"/>
    <line x1="180" y1="196" x2="198" y2="234" stroke="url(#goldLight)" stroke-width="1.6" opacity="0.85"/>
    <path d="M 156 234 C 160 250, 200 250, 204 234 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5"/>

    <!-- Right Scale Plate & Chains -->
    <line x1="332" y1="196" x2="314" y2="234" stroke="url(#goldLight)" stroke-width="1.6" opacity="0.85"/>
    <line x1="332" y1="196" x2="350" y2="234" stroke="url(#goldLight)" stroke-width="1.6" opacity="0.85"/>
    <path d="M 308 234 C 312 250, 352 250, 356 234 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5"/>

    <!-- Central Investigation Document / Badge -->
    <rect x="238" y="214" width="36" height="46" rx="4" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Document lines -->
    <line x1="244" y1="224" x2="268" y2="224" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
    <line x1="244" y1="231" x2="268" y2="231" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="244" y1="238" x2="268" y2="238" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="244" y1="245" x2="260" y2="245" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Red Official Stamp Dot -->
    <circle cx="264" cy="248" r="3.5" fill="#dc2626"/>
  </g>

  <!-- Lower Emerald Ribbon Banner with Gold Border -->
  <g filter="url(#shadowFilter)">
    <!-- Ribbon Shadow Fold -->
    <polygon points="105,422 135,395 135,432" fill="#022c1e"/>
    <polygon points="407,422 377,395 377,432" fill="#022c1e"/>

    <!-- Main Front Ribbon -->
    <path d="M 120 405 
             C 180 395, 332 395, 392 405 
             L 382 445 
             C 332 436, 180 436, 130 445 Z" 
          fill="url(#emeraldRibbon)" 
          stroke="url(#goldGrad)" 
          stroke-width="2.5"/>

    <!-- Banner Typography: INQUIRY REPORT -->
    <text x="256" y="426" 
          text-anchor="middle" 
          fill="#ffffff" 
          font-family="'Noto Nastaliq Urdu', 'Noto Naskh Urdu', Arial, sans-serif" 
          font-weight="900" 
          font-size="19" 
          letter-spacing="0.5"
          filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.8))">
      انکوائری رپورٹ اسسٹنٹ
    </text>

    <!-- Subtitle English Ribbon Text -->
    <text x="256" y="440" 
          text-anchor="middle" 
          fill="#fef08a" 
          font-family="'Inter', Arial, sans-serif" 
          font-weight="800" 
          font-size="9" 
          letter-spacing="2"
          opacity="0.95">
      PUNJAB POLICE INQUIRY
    </text>
  </g>
</svg>
