<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="shieldBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0e294b"/>
      <stop offset="60%" stop-color="#081b33"/>
      <stop offset="100%" stop-color="#030c18"/>
    </radialGradient>

    <radialGradient id="innerEmerald" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="70%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>

    <!-- Luxury Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <linearGradient id="goldRingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="20%" stop-color="#f59e0b"/>
      <stop offset="45%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="90%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <linearGradient id="ribbonNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Circular Base -->
  <circle cx="256" cy="256" r="250" fill="url(#shieldBg)" filter="url(#shadow)"/>
  
  <!-- Outer Gold Rim -->
  <circle cx="256" cy="256" r="242" fill="none" stroke="url(#goldRingGrad)" stroke-width="7"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#fde047" stroke-width="2" stroke-dasharray="6,4" opacity="0.8"/>
  <circle cx="256" cy="256" r="222" fill="url(#innerEmerald)" stroke="url(#goldRingGrad)" stroke-width="4"/>

  <!-- Star Embellishments -->
  <g fill="url(#goldGrad)">
    <circle cx="65" cy="256" r="4"/>
    <circle cx="447" cy="256" r="4"/>
  </g>

  <!-- Golden Laurel Wreath (حلقہ برگِ زیتون) -->
  <g fill="url(#goldGrad)" filter="url(#glow)" opacity="0.95">
    <!-- Left Branch -->
    <path d="M 120,290 C 110,265 105,230 112,195 C 117,204 125,214 122,230 C 116,215 118,185 128,160 C 134,170 140,183 136,200 C 130,180 136,150 150,125 C 156,137 160,151 154,170 C 150,150 160,120 178,100 C 183,113 186,127 178,145 C 176,125 190,100 210,85 C 213,99 214,113 204,129 C 206,109 223,90 243,80 C 242,95 238,109 228,121 Z"/>
    <!-- Right Branch -->
    <path d="M 392,290 C 402,265 407,230 400,195 C 395,204 387,214 390,230 C 396,215 394,185 384,160 C 378,170 372,183 376,200 C 382,180 376,150 362,125 C 356,137 352,151 358,170 C 362,150 352,120 334,100 C 329,113 326,127 334,145 C 336,125 322,100 302,85 C 299,99 298,113 308,129 C 306,109 289,90 269,80 C 270,95 274,109 284,121 Z"/>
  </g>

  <!-- Crescent & Star (ہلال و ستارہ) -->
  <g transform="translate(256, 115)" filter="url(#glow)">
    <path d="M 0,-44 A 42,42 0 1,0 36,24 A 34,34 0 1,1 0,-44 Z" fill="url(#goldGrad)"/>
    <polygon points="12,-18 17,-5 30,-5 19,3 23,16 12,8 1,16 5,3 -6,-5 7,-5" fill="url(#goldGrad)"/>
  </g>

  <!-- Scales of Justice (میزانِ عدل) -->
  <g transform="translate(256, 235)" filter="url(#shadow)">
    <!-- Central Pillar -->
    <path d="M -4,-68 L 4,-68 L 6,68 L -6,68 Z" fill="url(#goldRingGrad)"/>
    <circle cx="0" cy="-68" r="8" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="12" fill="url(#innerEmerald)" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5" fill="#fef08a"/>

    <!-- Pillar Base -->
    <path d="M -30,68 L 30,68 L 38,80 L -38,80 Z" fill="url(#goldRingGrad)"/>
    <rect x="-44" y="80" width="88" height="8" rx="4" fill="url(#ribbonNavy)" stroke="url(#goldGrad)" stroke-width="1.5"/>

    <!-- Scale Beam -->
    <path d="M -96,-50 Q 0,-58 96,-50 L 94,-43 Q 0,-51 -94,-43 Z" fill="url(#goldGrad)"/>

    <!-- Left Scale Strings & Pan -->
    <line x1="-92" y1="-43" x2="-116" y2="15" stroke="#fcd34d" stroke-width="2.5"/>
    <line x1="-92" y1="-43" x2="-68" y2="15" stroke="#fcd34d" stroke-width="2.5"/>
    <path d="M -124,15 Q -92,42 -60,15 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5"/>

    <!-- Right Scale Strings & Pan -->
    <line x1="92" y1="-43" x2="68" y2="15" stroke="#fcd34d" stroke-width="2.5"/>
    <line x1="92" y1="-43" x2="116" y2="15" stroke="#fcd34d" stroke-width="2.5"/>
    <path d="M 60,15 Q 92,42 124,15 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5"/>
  </g>

  <!-- Official Urdu Typography Top: پنجاب پولیس -->
  <path id="topTextArc" d="M 105,182 A 175,175 0 0,1 407,182" fill="none"/>
  <text fill="#ffffff" font-family="'Noto Nastaliq Urdu', 'Noto Naskh Urdu', 'Arial', sans-serif" font-size="32" font-weight="900" filter="url(#glow)">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      پنجاب پولیس
    </textPath>
  </text>

  <!-- Bottom Ribbon Container -->
  <g transform="translate(256, 405)" filter="url(#shadow)">
    <!-- Ribbon Body -->
    <path d="M -180,-30 L 180,-30 L 200,14 L 160,24 L 0,28 L -160,24 L -200,14 Z" fill="url(#ribbonNavy)" stroke="url(#goldGrad)" stroke-width="3.5"/>
    
    <!-- Ribbon Gold Lining -->
    <path d="M -170,-22 L 170,-22" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7"/>

    <!-- Bottom Urdu Text: ریجنل انویسٹی گیشن برانچ -->
    <text x="0" y="-2" fill="#fffbeb" font-family="'Noto Nastaliq Urdu', 'Noto Naskh Urdu', 'Arial', sans-serif" font-size="21" font-weight="bold" text-anchor="middle" filter="url(#glow)">
      ریجنل انویسٹی گیشن برانچ
    </text>
    <text x="0" y="18" fill="#fde047" font-family="'Arial', sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1.5">
      INQUIRY &amp; INVESTIGATION ASSISTANT
    </text>
  </g>
</svg>
