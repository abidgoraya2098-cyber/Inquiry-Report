<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background Shield / Rounded Shape -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="16 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Shield Base -->
  <g filter="url(#glow)">
    <path d="M256,70 C340,70 410,110 410,190 C410,320 256,430 256,430 C256,430 102,320 102,190 C102,110 172,70 256,70 Z" 
          fill="#064e3b" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round"/>
  </g>

  <!-- Star & Crescent (Emblem) -->
  <!-- Crescent -->
  <path d="M265,150 A65,65 0 1,0 315,260 A78,78 0 1,1 265,150 Z" fill="url(#goldGrad)" />
  <!-- Star -->
  <polygon points="295,175 304,198 328,198 309,212 316,235 295,221 274,235 281,212 262,198 286,198" fill="url(#goldGrad)" />

  <!-- Scales of Justice (انصاف کا ترازو) -->
  <g stroke="url(#goldGrad)" stroke-width="5" fill="none" stroke-linecap="round">
    <!-- Center Post -->
    <line x1="256" y1="230" x2="256" y2="350" stroke-width="8"/>
    <line x1="220" y1="350" x2="292" y2="350" stroke-width="8"/>
    <!-- Beam -->
    <line x1="170" y1="260" x2="342" y2="260" stroke-width="6"/>
    <!-- Center Ring -->
    <circle cx="256" cy="230" r="10" fill="url(#goldGrad)" stroke="none"/>
    <!-- Left Strings -->
    <line x1="170" y1="260" x2="145" y2="310" stroke-width="3"/>
    <line x1="170" y1="260" x2="195" y2="310" stroke-width="3"/>
    <!-- Right Strings -->
    <line x1="342" y1="260" x2="317" y2="310" stroke-width="3"/>
    <line x1="342" y1="260" x2="367" y2="310" stroke-width="3"/>
  </g>
  <!-- Left Pan -->
  <path d="M135,310 Q170,335 205,310 Z" fill="url(#goldGrad)" />
  <!-- Right Pan -->
  <path d="M307,310 Q342,335 377,310 Z" fill="url(#goldGrad)" />

  <!-- Text / Banner -->
  <rect x="120" y="375" width="272" height="42" rx="10" fill="#022c22" stroke="url(#goldGrad)" stroke-width="3"/>
  <text x="256" y="403" font-family="'Noto Nastaliq Urdu', 'Noto Naskh Urdu', Arial, sans-serif" font-size="22" font-weight="bold" fill="#fbbf24" text-anchor="middle">پنجاب پولیس</text>
</svg>
