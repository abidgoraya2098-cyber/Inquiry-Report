<!doctype html>
<html lang="ur" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Inquiry Report" />
    <meta name="application-name" content="Inquiry Report" />
    
    <!-- PWA & Favicon links -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.png" />

    <title>Inquiry Report - انکوائری رپورٹ اسسٹنٹ</title>

    <script>
      // Capture Google Chrome beforeinstallprompt event early
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-install-ready', { detail: e }));
        if (typeof window.onPWAInstallAvailable === 'function') {
          window.onPWAInstallAvailable(e);
        }
        console.log('PWA beforeinstallprompt captured successfully.');
      });

      window.addEventListener('appinstalled', () => {
        window.deferredInstallPrompt = null;
        console.log('PWA application installed on device.');
      });

      // Register PWA Service Worker safely
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((reg) => {
              console.log('PWA ServiceWorker registered with scope:', reg.scope);
            })
            .catch((err) => {
              console.warn('PWA ServiceWorker registration error:', err);
            });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
